name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workflow:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from source
        run: python -m pip install -e .
      - name: Offline setup check
        run: python -m threat_research.cli doctor
      - name: Test workflows
        run: python -m unittest discover -s tests -v
      - name: Test MCP stdio handshake and tool call
        run: python scripts/smoke_mcp.py
      - name: Test source to event replay
        run: python -m threat_research.cli demo-soc --output-directory soc-lab-ci
      - name: Build distributable wheel
        run: python -m pip wheel . --no-deps -w wheelhouse
      - name: Verify packaged lab fixtures
        run: python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('wheelhouse/*.whl')[0]); assert 'threat_research/lab_fixtures/events.jsonl' in z.namelist()"
